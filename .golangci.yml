version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.Root).Close
        - (*database/sql.DB).Close
        - (*github.com/aurimasniekis/go-harbor-pilot/internal/store.DB).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # covered by errcheck with explicit exclusions
        - G304 # file paths are operator-supplied and confined where it matters
        - G115 # integer conversions are bounds-checked where needed
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      # Quota adapters: public endpoint/grant constants are not credentials;
      # poll jitter does not need cryptographic randomness; indices are
      # bounds-checked by the loop guards; numeric parsers return nil for
      # unparseable provider values by design.
      - path: internal/quota/
        linters: [gosec]
        text: "G101|G404|G602"
      - path: internal/quota/providers/
        linters: [nilerr]
formatters:
  enable:
    - gofmt
