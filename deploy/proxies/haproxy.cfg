# Harbor Pilot behind HAProxy 2.4 or later, terminating TLS.
#
# HAProxy wants the certificate and key in one file: cat fullchain.pem privkey.pem > /etc/haproxy/certs/pilot.pem.
# Set Harbor Pilot's server.public_url to https://pilot.example.com and server.trusted_proxies to ["127.0.0.1/32"].

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout http-request 30s
    # A reply that is not streamed arrives in one piece when the model finishes, which can take minutes.
    # Streams are safe either way: Harbor Pilot sends a keepalive every 15 seconds.
    timeout client 15m
    timeout server 15m

frontend https
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/pilot.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend harbor_pilot

# HAProxy streams replies as they come and has no body size limit, so nothing else is needed.
backend harbor_pilot
    option httpchk GET /healthz
    server pilot 127.0.0.1:8080 check
