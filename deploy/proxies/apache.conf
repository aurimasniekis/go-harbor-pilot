# Harbor Pilot behind Apache httpd 2.4, terminating TLS.
#
#   a2enmod proxy proxy_http ssl headers
#
# Save as /etc/apache2/sites-available/harbor-pilot.conf (then a2ensite harbor-pilot), replace pilot.example.com
# and the certificate paths, and set Harbor Pilot's server.public_url to https://pilot.example.com and
# server.trusted_proxies to ["127.0.0.1/32"].

<VirtualHost *:80>
    ServerName pilot.example.com
    Redirect permanent / https://pilot.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName pilot.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pilot.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilot.example.com/privkey.pem

    # Harbor Pilot accepts requests up to 32 MiB.
    LimitRequestBody 33554432

    # A reply that is not streamed arrives in one piece when the model finishes, which can take minutes.
    ProxyTimeout 900

    # mod_proxy adds X-Forwarded-For. flushpackets=on sends each piece of a streamed reply on at once.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
