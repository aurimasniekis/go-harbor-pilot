# Harbor Pilot behind Traefik v3: static configuration (/etc/traefik/traefik.yml).
# The route itself is in dynamic/harbor-pilot.yml. Set Harbor Pilot's server.public_url to
# https://pilot.example.com and server.trusted_proxies to Traefik's address.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    directory: /etc/traefik/dynamic
