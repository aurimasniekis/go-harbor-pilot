# Harbor Pilot behind nginx (1.25.1 or later), terminating TLS.
#
# Save as /etc/nginx/conf.d/harbor-pilot.conf, replace pilot.example.com and the certificate paths, and set
# Harbor Pilot's server.public_url to https://pilot.example.com and server.trusted_proxies to ["127.0.0.1/32"].

server {
    listen 80;
    listen [::]:80;
    server_name pilot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pilot.example.com;

    ssl_certificate     /etc/letsencrypt/live/pilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilot.example.com/privkey.pem;

    # Tools send the whole conversation with every request. nginx refuses bodies over 1 MB by default;
    # Harbor Pilot accepts up to 32 MiB.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass replies and requests through as they arrive instead of spooling them to disk first.
        proxy_buffering off;
        proxy_request_buffering off;

        # A reply that is not streamed arrives in one piece when the model finishes, which can take minutes.
        # The default of 60 seconds cuts it off with a 504.
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }
}
