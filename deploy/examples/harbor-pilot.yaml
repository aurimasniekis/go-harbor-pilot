# Harbor Pilot bootstrap configuration.
#
# Only process-level settings live here. Providers, accounts, routing plans,
# client bindings, policies and notification channels are managed through the
# API, UI, CLI or Terraform and stored in the database.
server:
  listen: 127.0.0.1:8080
  public_url: https://harbor-pilot.example.test   # must be https in production
  data_dir: /var/lib/harbor-pilot
  trusted_proxies: []                              # e.g. ["10.0.0.0/8"] behind a reverse proxy
  shutdown_timeout: 30s
  # metrics_token_file: /etc/harbor-pilot/metrics.token
  # tls:
  #   cert_file: /etc/harbor-pilot/tls.crt
  #   key_file: /etc/harbor-pilot/tls.key
security:
  master_key_file: /etc/harbor-pilot/master.key   # `harbor-pilot keys generate`
  previous_master_key_files: []
  secret_roots: [/etc/harbor-pilot/secrets]       # confines file: secret references (never the data dir or key files)
  # secret_env_prefixes: [HP_SECRET_]              # env: secret references may read only these variables
log:
  level: info
