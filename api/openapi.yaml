components:
  schemas:
    APITokenDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        last_used_ip:
          type: string
        name:
          type: string
        prefix:
          description: Non-secret token prefix for identification (hpa_<prefix>_…).
          type: string
        revoked_at:
          format: date-time
          type: string
      required:
        - id
        - prefix
        - name
        - created_by
        - created_at
      type: object
    APITokenList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/APITokenDTO"
          type: array
      required:
        - items
      type: object
    AcceptInBody:
      additionalProperties: false
      properties:
        password:
          maxLength: 4096
          type: string
        purpose:
          enum:
            - invite
            - reset
          type: string
        token:
          maxLength: 128
          type: string
      required:
        - token
        - purpose
        - password
      type: object
    AccountSpec:
      additionalProperties: false
      properties:
        allowed_models:
          description: Restrict to these provider model ids; empty = all models of the provider.
          items:
            type: string
          type: array
        billing:
          description: How usage on this account is paid for. Paid fallback rules use this.
          enum:
            - metered_api
            - subscription
            - free
            - local
          type: string
        credential_ref:
          description: env:NAME or file:/path. Alternative to the write-only 'credential' secret.
          type: string
        display_name:
          maxLength: 120
          type: string
        enabled:
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: Free-form labels available to routing expressions as account.labels.
          type: object
        max_concurrency:
          description: Local concurrency cap enforced by reservations; 0 = unlimited.
          format: int64
          maximum: 10000
          minimum: 0
          type: integer
        provider_id:
          type: string
        requests_per_minute:
          description: Local request rate cap; 0 = unlimited.
          format: int64
          maximum: 1000000
          minimum: 0
          type: integer
      required:
        - provider_id
        - display_name
        - credential_ref
        - billing
        - allowed_models
        - max_concurrency
        - requests_per_minute
        - enabled
        - labels
      type: object
    ActivitySummary:
      additionalProperties: false
      properties:
        avg_ttft_ms:
          format: double
          type:
            - number
            - "null"
        by_harness:
          additionalProperties:
            format: int64
            type: integer
          type: object
        by_model:
          additionalProperties:
            format: int64
            type: integer
          type: object
        by_status:
          additionalProperties:
            format: int64
            type: integer
          type: object
        costs:
          description: Totals per currency and cost kind (never summed across kinds).
          items:
            $ref: "#/components/schemas/CostDTO"
          type: array
        fallbacks:
          description: Requests that needed more than one attempt.
          format: int64
          type: integer
        from:
          format: date-time
          type: string
        requests:
          format: int64
          type: integer
        telemetry_dropped:
          description: Records dropped under back-pressure since start (coverage gap).
          format: int64
          type: integer
        to:
          format: date-time
          type: string
        tokens:
          $ref: "#/components/schemas/Tokens"
        unknown_usage:
          description: Requests whose usage the upstream did not report.
          format: int64
          type: integer
      required:
        - from
        - to
        - requests
        - by_status
        - by_harness
        - by_model
        - tokens
        - costs
        - avg_ttft_ms
        - fallbacks
        - unknown_usage
        - telemetry_dropped
      type: object
    AliasSpec:
      additionalProperties: false
      properties:
        alias_id:
          description: Target alias (chains are allowed; cycles are rejected).
          type: string
        description:
          maxLength: 500
          type: string
        pool_id:
          description: Target pool (exactly one of pool_id or alias_id).
          type: string
        required_capabilities:
          description: Capabilities every candidate must have in addition to what a request demands.
          items:
            type: string
          type: array
      required:
        - description
        - pool_id
        - alias_id
        - required_capabilities
      type: object
    AttemptDTO:
      additionalProperties: false
      properties:
        account_id:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        error_kind:
          type: string
        error_message:
          type: string
        executed:
          description: The upstream may have processed this attempt (never replayed).
          type: boolean
        failover_reason:
          type: string
        finished_at:
          format: date-time
          type: string
        http_status:
          format: int64
          type: integer
        id:
          type: string
        mode:
          type: string
        model:
          type: string
        "n":
          format: int64
          type: integer
        provider_id:
          type: string
        retry_after_s:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        status:
          type: string
        tokens:
          $ref: "#/components/schemas/Tokens"
        ttft_ms:
          format: int64
          type:
            - integer
            - "null"
        unknown_events:
          items:
            type: string
          type: array
        upstream_protocol:
          type: string
      required:
        - id
        - "n"
        - started_at
        - account_id
        - provider_id
        - model
        - upstream_protocol
        - mode
        - status
        - error_kind
        - error_message
        - executed
        - ttft_ms
        - duration_ms
        - failover_reason
        - tokens
        - unknown_events
      type: object
    AuditEntryDTO:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_kind:
          type: string
        at:
          format: date-time
          type: string
        details: {}
        id:
          type: string
        ip:
          type: string
        outcome:
          type: string
        request_id:
          type: string
        target_id:
          type: string
        target_kind:
          type: string
      required:
        - id
        - at
        - actor_id
        - actor_kind
        - action
        - outcome
        - details
      type: object
    AuthSettingsDTO:
      additionalProperties: false
      properties:
        absolute_timeout_seconds:
          format: int64
          maximum: 2592000
          minimum: 300
          type: integer
        idle_timeout_seconds:
          format: int64
          maximum: 86400
          minimum: 300
          type: integer
        password_login:
          description: When false, only SSO (and break-glass recovery) can sign in.
          type: boolean
        revision:
          format: int64
          readOnly: true
          type: integer
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
        - password_login
        - idle_timeout_seconds
        - absolute_timeout_seconds
        - updated_at
        - revision
      type: object
    BindingLimits:
      additionalProperties: false
      properties:
        max_concurrency:
          description: 0 = unlimited.
          format: int64
          minimum: 0
          type: integer
        max_request_bytes:
          description: 0 = server default.
          format: int64
          minimum: 0
          type: integer
        requests_per_minute:
          description: 0 = unlimited.
          format: int64
          minimum: 0
          type: integer
      required:
        - requests_per_minute
        - max_concurrency
        - max_request_bytes
      type: object
    BindingSpec:
      additionalProperties: false
      properties:
        allowed_models:
          description: Requested model names (aliases or plan mappings) this client may use; empty = any the plan maps.
          items:
            type: string
          type: array
        allowed_project_ids:
          description: Projects a trusted project hint may select.
          items:
            type: string
          type: array
        display_name:
          maxLength: 120
          type: string
        enabled:
          type: boolean
        expected_harness:
          description: Informational; mismatches are recorded, never enforced as identity.
          enum:
            - claude_code
            - codex
            - opencode
            - pi
            - generic
            - ""
          type: string
        external_refs:
          additionalProperties:
            type: string
          description: Operator-configured trusted references.
          type: object
        limits:
          $ref: "#/components/schemas/BindingLimits"
        owner_id:
          description: usr_… or pri_… (empty when owner_kind is none).
          type: string
        owner_kind:
          description: Who is accountable for this client (empty = none).
          enum:
            - user
            - service
            - none
            - ""
          type: string
        plan_id:
          type: string
        project_id:
          description: Default project for attribution (optional).
          type: string
        trust:
          $ref: "#/components/schemas/BindingTrust"
      required:
        - display_name
        - owner_kind
        - owner_id
        - plan_id
        - project_id
        - allowed_project_ids
        - expected_harness
        - allowed_models
        - limits
        - trust
        - external_refs
        - enabled
      type: object
    BindingTrust:
      additionalProperties: false
      properties:
        intent_hints:
          description: Accept declared intent (X-HP-Intent) as trusted.
          type: boolean
        project_hints:
          description: Allow X-HP-Project to select one of allowed_project_ids.
          type: boolean
        session_hints:
          description: Use harness session headers to group requests into sessions.
          type: boolean
      required:
        - session_hints
        - project_hints
        - intent_hints
      type: object
    Bundle:
      additionalProperties: false
      properties:
        api_version:
          type: string
        config_revision:
          format: int64
          type: integer
        exported_at:
          format: date-time
          type: string
        plans:
          items:
            $ref: "#/components/schemas/BundlePlan"
          type: array
        resources:
          items:
            $ref: "#/components/schemas/BundleResource"
          type: array
      required:
        - api_version
        - exported_at
        - config_revision
        - resources
        - plans
      type: object
    BundlePlan:
      additionalProperties: false
      properties:
        plan:
          type: string
        published: {}
        version:
          format: int64
          type: integer
      required:
        - plan
        - version
        - published
      type: object
    BundleResource:
      additionalProperties: false
      properties:
        kind:
          type: string
        managed_by:
          type: string
        name:
          type: string
        secrets:
          additionalProperties:
            $ref: "#/components/schemas/SecretInfo"
          description: Presence only; values are never exported.
          type: object
        spec: {}
      required:
        - kind
        - name
        - spec
      type: object
    CostDTO:
      additionalProperties: false
      properties:
        amount:
          description: Exact decimal.
          type: string
        currency:
          type: string
        kind:
          description: list_equivalent is not an invoice.
          enum:
            - estimated_api_charge
            - list_equivalent
            - actual_api_charge
            - none
          type: string
        price_version:
          type: string
      required:
        - amount
        - currency
        - kind
      type: object
    CreateUserInBody:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 120
          type: string
        email:
          maxLength: 254
          type: string
        invite:
          description: Return a one-time invitation link (valid 72h) for the user to set a password.
          type: boolean
        role:
          enum:
            - admin
            - operator
            - viewer
          type: string
      required:
        - email
        - role
        - invite
      type: object
    CreateUserOutBody:
      additionalProperties: false
      properties:
        invite_expires_at:
          format: date-time
          type: string
        invite_url:
          type: string
        user:
          $ref: "#/components/schemas/UserDTO"
      required:
        - user
      type: object
    Credential:
      additionalProperties: false
      properties:
        binding_id:
          type: string
        bound_refs:
          additionalProperties:
            type: string
          description: Trusted external references bound at mint time (e.g. spaceman.run).
          type: object
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        last_used_ip:
          type: string
        managed_by:
          type: string
        name:
          type: string
        parent_id:
          type: string
        prefix:
          description: Non-secret prefix (hpk_<prefix>_…).
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type: array
      required:
        - id
        - prefix
        - binding_id
        - name
        - scopes
        - bound_refs
        - managed_by
        - created_by
        - created_at
      type: object
    CredentialList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Credential"
          type: array
      required:
        - items
      type: object
    DraftRequest:
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/PlanDocument"
        note:
          maxLength: 500
          type: string
      required:
        - document
        - note
      type: object
    DriftedObject:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - id
        - kind
        - name
      type: object
    EffectiveAlias:
      additionalProperties: false
      properties:
        chain:
          items:
            type: string
          type: array
        id:
          type: string
        name:
          type: string
        pool_id:
          type: string
      required:
        - id
        - name
        - chain
        - pool_id
      type: object
    EffectiveDTO:
      additionalProperties: false
      properties:
        aliases:
          items:
            $ref: "#/components/schemas/EffectiveAlias"
          type: array
        compiled_at:
          format: date-time
          type: string
        config_revision:
          format: int64
          type: integer
        counts:
          additionalProperties:
            format: int64
            type: integer
          type: object
        drifted:
          items:
            $ref: "#/components/schemas/DriftedObject"
          type: array
        plans:
          items:
            $ref: "#/components/schemas/EffectivePlan"
          type: array
      required:
        - config_revision
        - compiled_at
        - counts
        - plans
        - aliases
        - drifted
      type: object
    EffectivePlan:
      additionalProperties: false
      properties:
        bindings:
          format: int64
          type: integer
        id:
          type: string
        name:
          type: string
        published_version:
          description: 0 when no version is published.
          format: int64
          type: integer
        version_id:
          type: string
      required:
        - id
        - name
        - published_version
        - bindings
      type: object
    EntitlementSpec:
      additionalProperties: false
      properties:
        account_id:
          type: string
        currency:
          type: string
        ends_on:
          description: YYYY-MM-DD, empty = open-ended
          type: string
        fee:
          description: Subscription fee per period as a decimal string.
          type: string
        period:
          enum:
            - monthly
            - yearly
          type: string
        plan_name:
          maxLength: 120
          type: string
        starts_on:
          description: YYYY-MM-DD
          type: string
        windows:
          items:
            $ref: "#/components/schemas/WindowSpec"
          type: array
      required:
        - account_id
        - plan_name
        - fee
        - currency
        - period
        - starts_on
        - ends_on
        - windows
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
      required:
        - error
      type: object
    ErrorInfo:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          type: string
        details:
          description: Optional structured details.
        message:
          description: Human-readable message. Never contains secrets.
          type: string
        request_id:
          description: Correlates with server logs.
          type: string
      required:
        - code
        - message
      type: object
    FallbackPolicy:
      additionalProperties: false
      properties:
        allow_paid_fallback:
          description: Allow falling back from free/subscription/local candidates to metered_api candidates.
          type: boolean
        max_attempts:
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        steps:
          description: "Ordered steps: retry, alternate_account, alternate_model, alternate_provider, wait, stop."
          items:
            type: string
          type: array
        wait_max_seconds:
          description: Upper bound for the wait step.
          format: int64
          maximum: 600
          minimum: 0
          type: integer
      required:
        - steps
        - max_attempts
        - allow_paid_fallback
        - wait_max_seconds
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          type: string
        message:
          type: string
      required:
        - location
        - message
      type: object
    GrantsInBody:
      additionalProperties: false
      properties:
        grants:
          items:
            enum:
              - traces.content.read
              - traces.content.unredacted
              - traces.export
            type: string
          type: array
      required:
        - grants
      type: object
    HistoryEntry:
      additionalProperties: false
      properties:
        actor_id:
          type: string
        at:
          format: date-time
          type: string
        config_revision:
          format: int64
          type: integer
        managed_by:
          type: string
        operation:
          type: string
        revision:
          format: int64
          type: integer
        spec: {}
      required:
        - revision
        - operation
        - managed_by
        - actor_id
        - at
        - config_revision
      type: object
    HistoryList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/HistoryEntry"
          type: array
      required:
        - items
      type: object
    IdentityDTO:
      additionalProperties: false
      properties:
        issuer:
          type: string
        last_seen_at:
          format: date-time
          type: string
        linked_at:
          format: date-time
          type: string
        provider_id:
          type: string
        subject:
          type: string
      required:
        - provider_id
        - issuer
        - subject
        - linked_at
      type: object
    ImportAction:
      additionalProperties: false
      properties:
        action:
          enum:
            - create
            - update
            - unchanged
            - delete
            - publish
            - skip
          type: string
        detail:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - action
        - kind
        - name
      type: object
    ImportRequest:
      additionalProperties: false
      properties:
        allow_terraform:
          description: Overwrite Terraform-managed objects (they will show as drifted).
          type: boolean
        bundle:
          $ref: "#/components/schemas/Bundle"
        dry_run:
          type: boolean
        modes:
          additionalProperties:
            type: string
          description: "Per kind: merge (default) or replace (also delete objects absent from the bundle)."
          type: object
        publish_plans:
          description: Publish the bundle's plan documents when they differ.
          type: boolean
      required:
        - bundle
        - dry_run
        - publish_plans
        - allow_terraform
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        actions:
          items:
            $ref: "#/components/schemas/ImportAction"
          type: array
        config_revision:
          format: int64
          type: integer
        dry_run:
          type: boolean
        warnings:
          items:
            type: string
          type: array
      required:
        - dry_run
        - actions
        - warnings
        - config_revision
      type: object
    IssueAPITokenRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 80
          minLength: 1
          type: string
        ttl_seconds:
          description: 0 = no expiry.
          format: int64
          maximum: 63072000
          minimum: 0
          type: integer
      required:
        - name
      type: object
    IssueCredentialRequest:
      additionalProperties: false
      properties:
        bound_refs:
          additionalProperties:
            type: string
          description: Trusted references bound to this credential.
          type: object
        name:
          maxLength: 80
          minLength: 1
          type: string
        scopes:
          description: "Default: gateway:invoke, gateway:models."
          items:
            type: string
          type: array
        ttl_seconds:
          description: 0 = no expiry.
          format: int64
          maximum: 63072000
          minimum: 0
          type: integer
      required:
        - name
      type: object
    IssuedAPIToken:
      additionalProperties: false
      properties:
        plaintext:
          description: The bearer token. Shown exactly once; store it securely.
          type: string
        token:
          $ref: "#/components/schemas/APITokenDTO"
      required:
        - token
        - plaintext
      type: object
    IssuedCredential:
      additionalProperties: false
      properties:
        base_urls:
          additionalProperties:
            type: string
          description: Base URLs per protocol for client configuration.
          type: object
        credential:
          $ref: "#/components/schemas/Credential"
        token:
          description: The bearer token (hpk_…). Returned exactly once.
          type: string
      required:
        - credential
        - token
        - base_urls
      type: object
    LedgerDTO:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        attempt_id:
          type: string
        billing:
          type: string
        cost:
          $ref: "#/components/schemas/CostDTO"
        id:
          type: string
        kind:
          type: string
        model:
          type: string
        provenance: {}
        tokens:
          $ref: "#/components/schemas/Tokens"
        usage_source:
          type: string
      required:
        - id
        - at
        - kind
        - attempt_id
        - account_id
        - model
        - billing
        - tokens
        - usage_source
        - provenance
      type: object
    LinkOutBody:
      additionalProperties: false
      properties:
        auth_url:
          type: string
      required:
        - auth_url
      type: object
    LoginInBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          type: string
        password:
          maxLength: 4096
          type: string
      required:
        - email
        - password
      type: object
    MetaDTO:
      additionalProperties: false
      properties:
        api_version:
          type: string
        demo:
          description: True when serving the deterministic synthetic demo dataset.
          type: boolean
        product:
          type: string
        public_url:
          type: string
        server_time:
          format: date-time
          type: string
        started_at:
          format: date-time
          type: string
        version:
          type: string
      required:
        - product
        - version
        - api_version
        - demo
        - server_time
        - public_url
        - started_at
      type: object
    ModelMapping:
      additionalProperties: false
      properties:
        alias_id:
          type: string
        match:
          description: Requested model name or glob (e.g. claude-sonnet-*).
          type: string
        note:
          maxLength: 200
          type: string
      required:
        - match
        - alias_id
        - note
      type: object
    ModelPricing:
      additionalProperties: false
      properties:
        cache_read_per_mtok:
          type: string
        cache_write_per_mtok:
          type: string
        currency:
          description: ISO 4217 currency, e.g. USD.
          type: string
        input_per_mtok:
          description: Decimal price per million input tokens.
          type: string
        output_per_mtok:
          type: string
        price_version:
          description: Operator label for this price list, recorded on every cost estimate.
          type: string
      required:
        - currency
        - input_per_mtok
        - output_per_mtok
        - cache_read_per_mtok
