info:
  description: "Control-plane API for Harbor Pilot: configuration, routing plans, accounting, activity, traces, events and notifications. The gateway data plane (/v1/messages, /v1/chat/completions, /v1/responses, /v1beta/models) is documented separately."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Harbor Pilot API
  version: dev
openapi: 3.1.0
paths:
  /activity/requests:
    get:
      operationId: list-requests
      parameters:
        - description: Opaque cursor from a previous page's next_cursor.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous page's next_cursor.
            type: string
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: binding_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: project_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: session_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: account_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - in_progress
              - ok
              - error
              - blocked
              - canceled
              - ""
            type: string
